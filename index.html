<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congarden ✿ Personal Inspiration & Notes Garden</title>

    <!-- Typography (Preserved & Adapted Visual Aesthetic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bellota:ital,wght@0,400;0,700;1,400&family=Imprima&family=Instrument+Serif:ital@0;1&family=Josefin+Sans:wght@300;400;600&family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Firebase SDKs for Production-Grade Cloud Auth, Database & Storage -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <style>
        /* ==================== CONGARDEN BRANDING & VISUAL SYSTEM ==================== */
        :root {
            --bg-paper: #FAF7F2;
            --bg-card: #FFFFFF;
            --bg-sidebar: #F3EEE7;
            --accent-pink: #E8B4B8;
            --accent-pink-soft: #F9ECEE;
            --accent-sage: #A2B9A5;
            --accent-sage-soft: #EBF2EC;
            --accent-lavender: #C5B4E3;
            --accent-butter: #F7E7B4;
            --text-main: #4A3E3D;
            --text-muted: #8C7B79;
            --border-soft: #E6DDD5;
            --border-dashed: #D3C7BD;
            --shadow-subtle: 0 4px 20px rgba(74, 62, 61, 0.05);
            --shadow-card: 0 8px 24px rgba(74, 62, 61, 0.08);

            --font-title: 'Instrument Serif', serif;
            --font-ui: 'Josefin Sans', sans-serif;
            --font-body: 'Imprima', sans-serif;
            --font-cute: 'Bellota', cursive;
            --font-pixel: 'Press Start 2P', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-body);
            color: var(--text-main);
        }

        body {
            background-color: var(--bg-paper);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(var(--border-soft) 1px, transparent 0);
            background-size: 24px 24px;
        }

        /* Subtly Decorated Paper Details */
        ::selection { background: var(--accent-pink-soft); color: var(--text-main); }
        input, textarea, button { font-family: inherit; }

        /* ==================== LOGGED-OUT WELCOME STATE ==================== */
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(250, 247, 242, 0.95);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 2px dashed var(--accent-pink);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow-card);
            position: relative;
        }

        .auth-card::before {
            content: "✿";
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-paper);
            padding: 0 12px;
            font-size: 1.5rem;
            color: var(--accent-pink);
        }

        .auth-card h1 {
            font-family: var(--font-title);
            font-size: 2.8rem;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .auth-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        .btn-google {
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            padding: 12px 24px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-ui);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-subtle);
            width: 100%;
            justify-content: center;
        }

        .btn-google:hover {
            background: var(--accent-pink-soft);
            border-color: var(--accent-pink);
            transform: translateY(-2px);
        }

        /* ==================== MAIN APP LAYOUT (SINGLE PAGE APP) ==================== */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            gap: 20px;
            flex-shrink: 0;
        }

        .brand {
            font-family: var(--font-title);
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 8px;
        }

        .brand span.decor {
            font-size: 1.2rem;
            color: var(--accent-pink);
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            border-radius: 50px;
            border: 1px solid var(--border-soft);
            background: var(--bg-card);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus { border-color: var(--accent-sage); }
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            opacity: 0.5;
        }

        .nav-section-title {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin: 8px 8px 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-add-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .btn-add-icon:hover { color: var(--text-main); }

        .folder-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            flex: 1;
        }

        .folder-item {
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--font-ui);
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .folder-item:hover, .folder-item.active {
            background: var(--bg-card);
            box-shadow: var(--shadow-subtle);
        }

        .folder-item.active { font-weight: 600; }
        .folder-actions { display: none; gap: 6px; font-size: 0.8rem; }
        .folder-item:hover .folder-actions { display: flex; }

        .user-profile-bar {
            padding-top: 16px;
            border-top: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-pink-soft); object-fit: cover; }
        .user-name { font-size: 0.85rem; font-weight: 600; font-family: var(--font-ui); }
        .btn-logout { background: none; border: none; font-size: 0.8rem; color: var(--text-muted); cursor: pointer; }

        /* Content Viewport */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: transparent;
        }

        .content-header {
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-soft);
        }

        .header-title {
            font-family: var(--font-title);
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-new-note {
            background: var(--accent-sage);
            color: #FFF;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-family: var(--font-ui);
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-subtle);
            transition: transform 0.2s, background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-new-note:hover { background: #91A894; transform: translateY(-1px); }

        /* Notes Masonry Grid */
        .notes-view {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .note-card {
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-subtle);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .note-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-card);
            border-color: var(--accent-pink);
        }

        .note-card-title {
            font-family: var(--font-ui);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .note-card-snippet {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
            max-height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-card-media-preview {
            width: 100%;
            height: 140px;
            border-radius: 10px;
            object-fit: cover;
        }

        .note-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: auto;
            padding-top: 8px;
        }

        /* ==================== SCRAPBOOK NOTE EDITOR ==================== */
        .editor-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-paper);
            z-index: 500;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .editor-overlay.active { display: flex; }

        .editor-header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-soft);
            background: rgba(250, 247, 242, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .btn-back {
            background: none;
            border: none;
            font-family: var(--font-ui);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .editor-body {
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px 100px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .editor-title {
            font-family: var(--font-title);
            font-size: 2.8rem;
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
        }

        .editor-text {
            font-size: 1.05rem;
            line-height: 1.7;
            border: none;
            outline: none;
            background: transparent;
            resize: none;
            min-height: 150px;
            width: 100%;
        }

        .editor-toolbar {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-top: 1px dashed var(--border-dashed);
            border-bottom: 1px dashed var(--border-dashed);
        }

        .btn-tool {
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            padding: 8px 16px;
            border-radius: 50px;
            font-family: var(--font-ui);
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-tool:hover { background: var(--accent-sage-soft); }

        /* Media Scrapbook Elements */
        .scrapbook-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .polaroid-wrapper {
            background: #FFF;
            padding: 10px 10px 20px 10px;
            border-radius: 8px;
            box-shadow: var(--shadow-subtle);
            border: 1px solid var(--border-soft);
            position: relative;
        }

        .polaroid-wrapper img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 4px;
        }

        .btn-remove-media {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0,0,0,0.5);
            color: #FFF;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .link-cards-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-card {
            background: var(--bg-card);
            border: 1px solid var(--border-soft);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
        }

        .link-card:hover { border-color: var(--accent-pink); }
        .link-info { display: flex; align-items: center; gap: 10px; }
        .link-url { font-size: 0.85rem; color: var(--accent-sage); word-break: break-all; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; padding: 16px; }
            .notes-view { padding: 16px; }
            .editor-header { padding: 16px 20px; }
        }
    </style>
</head>
<body>

    <!-- LOGGED-OUT WELCOME OVERLAY -->
    <div id="auth-overlay" class="auth-overlay">
        <div class="auth-card">
            <h1>congarden</h1>
            <p>Your personal digital inspiration garden. Collect notes, ideas, photos & references effortless in one aesthetic space.</p>
            <button class="btn-google" onclick="loginGoogle()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div class="app-container">
        
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="brand">
                congarden <span class="decor">✿</span>
            </div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search inspiration..." oninput="filterNotes()">
            </div>

            <div class="nav-section-title">
                <span>My Garden</span>
                <button class="btn-add-icon" onclick="promptCreateFolder()" title="Create Folder">＋</button>
            </div>

            <ul class="folder-list" id="folder-list">
                <!-- Dynamic Folder List Items -->
            </ul>

            <div class="user-profile-bar">
                <div class="user-info">
                    <img id="user-avatar" class="user-avatar" src="" alt="">
                    <span id="user-name" class="user-name">User</span>
                </div>
                <button class="btn-logout" onclick="logout()">Sign Out</button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="content-area">
            <header class="content-header">
                <h2 id="current-folder-title" class="header-title">🌸 All Inspiration</h2>
                <button class="btn-new-note" onclick="openEditor()">＋ New Note</button>
            </header>

            <div class="notes-view">
                <div class="notes-grid" id="notes-grid">
                    <!-- Dynamic Scrapbook Cards -->
                </div>
            </div>
        </main>

    </div>

    <!-- SCRAPBOOK NOTE EDITOR OVERLAY -->
    <div id="editor-overlay" class="editor-overlay">
        <div class="editor-header">
            <button class="btn-back" onclick="closeEditor()">← Back to Garden</button>
            <div style="display: flex; gap: 10px;">
                <button class="btn-tool" onclick="toggleFavorite()"><span id="fav-icon">♡</span> Favorite</button>
                <button class="btn-tool" style="color: #d9534f;" onclick="deleteCurrentNote()">Delete</button>
            </div>
        </div>

        <div class="editor-body">
            <input type="text" id="editor-title" class="editor-title" placeholder="Note Title..." oninput="autoSaveNote()">
            
            <div class="editor-toolbar">
                <label class="btn-tool">
                    📷 + Photo
                    <input type="file" id="photo-input" accept="image/*" multiple style="display: none;" onchange="handlePhotoUpload(event)">
                </label>
                <button class="btn-tool" onclick="promptAddLink()">🔗 + Link</button>
            </div>

            <textarea id="editor-text" class="editor-text" placeholder="Write thoughts, ideas, references freely..." oninput="autoSaveNote()"></textarea>

            <div class="scrapbook-gallery" id="editor-gallery">
                <!-- Dynamic Uploaded Photos -->
            </div>

            <div class="link-cards-container" id="editor-links">
                <!-- Dynamic Links -->
            </div>
        </div>
    </div>

    <!-- APPLICATION LOGIC & FIREBASE INTEGRATION -->
    <script>
        /* ==================== CONFIG & STATE ==================== */
        // Configure your Firebase project credential below to connect persistent cloud storage.
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        let currentUser = null;
        let folders = [];
        let notes = [];
        let activeFolderId = 'all';
        let activeNoteId = null;
        let saveTimeout = null;

        /* ==================== AUTHENTICATION ==================== */
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('user-avatar').src = user.photoURL || '';
                document.getElementById('user-name').innerText = user.displayName || 'Gardener';
                loadUserData();
            } else {
                currentUser = null;
                document.getElementById('auth-overlay').style.display = 'flex';
            }
        });

        function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(error => alert("Authentication failed: " + error.message));
        }

        function logout() {
            auth.signOut();
        }

        /* ==================== DATA SYNCHRONIZATION ==================== */
        function loadUserData() {
            if (!currentUser) return;

            // Fetch Folders
            db.collection('users').doc(currentUser.uid).collection('folders').onSnapshot(snapshot => {
                folders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderFolders();
            });

            // Fetch Notes
            db.collection('users').doc(currentUser.uid).collection('notes').orderBy('updatedAt', 'desc').onSnapshot(snapshot => {
                notes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderNotes();
            });
        }

        /* ==================== FOLDER MANAGEMENT ==================== */
        function renderFolders() {
            const list = document.getElementById('folder-list');
            list.innerHTML = `
                <li class="folder-item ${activeFolderId === 'all' ? 'active' : ''}" onclick="selectFolder('all')">
                    <span>🌷 All Inspiration</span>
                </li>
                <li class="folder-item ${activeFolderId === 'favorites' ? 'active' : ''}" onclick="selectFolder('favorites')">
                    <span>♡ Favorites</span>
                </li>
            `;

            folders.forEach(folder => {
                const li = document.createElement('li');
                li.className = `folder-item ${activeFolderId === folder.id ? 'active' : ''}`;
                li.onclick = () => selectFolder(folder.id);
                li.innerHTML = `
                    <span>📁 ${folder.name}</span>
                    <div class="folder-actions">
                        <span onclick="event.stopPropagation(); deleteFolder('${folder.id}')">🗑️</span>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function selectFolder(id) {
            activeFolderId = id;
            renderFolders();
            const titleElement = document.getElementById('current-folder-title');
            if (id === 'all') titleElement.innerText = '🌸 All Inspiration';
            else if (id === 'favorites') titleElement.innerText = '♡ Favorites';
            else {
                const folder = folders.find(f => f.id === id);
                titleElement.innerText = folder ? `📁 ${folder.name}` : 'Folder';
            }
            renderNotes();
        }

        function promptCreateFolder() {
            const name = prompt("Enter new folder name:");
            if (name && currentUser) {
                db.collection('users').doc(currentUser.uid).collection('folders').add({
                    name: name,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
        }

        function deleteFolder(id) {
            if (confirm("Delete this folder? Notes inside won't be deleted.")) {
                db.collection('users').doc(currentUser.uid).collection('folders').doc(id).delete();
                if (activeFolderId === id) selectFolder('all');
            }
        }

        /* ==================== NOTES RENDERING & FILTERS ==================== */
        function renderNotes() {
            const grid = document.getElementById('notes-grid');
            grid.innerHTML = '';

            let filtered = notes;
            if (activeFolderId === 'favorites') {
                filtered = notes.filter(n => n.favorite);
            } else if (activeFolderId !== 'all') {
                filtered = notes.filter(n => n.folderId === activeFolderId);
            }

            const query = document.getElementById('search-input').value.toLowerCase();
            if (query) {
                filtered = filtered.filter(n => 
                    (n.title && n.title.toLowerCase().includes(query)) ||
                    (n.text && n.text.toLowerCase().includes(query))
                );
            }

            filtered.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.onclick = () => openEditor(note.id);

                let mediaHTML = '';
                if (note.images && note.images.length > 0) {
                    mediaHTML = `<img src="${note.images[0]}" class="note-card-media-preview" alt="Scrapbook item">`;
                }

                card.innerHTML = `
                    ${mediaHTML}
                    <div class="note-card-title">${note.title || 'Untitled Note'}</div>
                    <div class="note-card-snippet">${note.text || 'No additional text...'}</div>
                    <div class="note-card-footer">
                        <span>${note.images ? note.images.length : 0} 📷 • ${note.links ? note.links.length : 0} 🔗</span>
                        <span>${note.favorite ? '♡' : ''}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterNotes() {
            renderNotes();
        }

        /* ==================== EDITOR & SCRAPBOOK LOGIC ==================== */
        function openEditor(noteId = null) {
            activeNoteId = noteId;
            const overlay = document.getElementById('editor-overlay');
            overlay.classList.add('active');

            if (noteId) {
                const note = notes.find(n => n.id === noteId);
                document.getElementById('editor-title').value = note.title || '';
                document.getElementById('editor-text').value = note.text || '';
                document.getElementById('fav-icon').innerText = note.favorite ? '♥' : '♡';
                renderEditorMedia(note.images || [], note.links || []);
            } else {
                // Create New Note Directly
                document.getElementById('editor-title').value = '';
                document.getElementById('editor-text').value = '';
                document.getElementById('fav-icon').innerText = '♡';
                renderEditorMedia([], []);
                saveNewNote();
            }
        }

        function closeEditor() {
            document.getElementById('editor-overlay').classList.remove('active');
            activeNoteId = null;
        }

        function saveNewNote() {
            if (!currentUser) return;
            const newDocRef = db.collection('users').doc(currentUser.uid).collection('notes').doc();
            activeNoteId = newDocRef.id;
            newDocRef.set({
                title: '',
                text: '',
                folderId: activeFolderId === 'favorites' ? 'all' : activeFolderId,
                images: [],
                links: [],
                favorite: false,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function autoSaveNote() {
            if (!activeNoteId || !currentUser) return;
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                const title = document.getElementById('editor-title').value;
                const text = document.getElementById('editor-text').value;

                db.collection('users').doc(currentUser.uid).collection('notes').doc(activeNoteId).update({
                    title: title,
                    text: text,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }, 400);
        }

        function toggleFavorite() {
            if (!activeNoteId || !currentUser) return;
            const note = notes.find(n => n.id === activeNoteId);
            const newState = !note.favorite;
            document.getElementById('fav-icon').innerText = newState ? '♥' : '♡';
            db.collection('users').doc(currentUser.uid).collection('notes').doc(activeNoteId).update({
                favorite: newState
            });
        }

        function deleteCurrentNote() {
            if (activeNoteId && currentUser && confirm("Delete this inspiration note?")) {
                db.collection('users').doc(currentUser.uid).collection('notes').doc(activeNoteId).delete();
                closeEditor();
            }
        }

        /* Media Uploads & Link Attachments */
        function handlePhotoUpload(event) {
            const files = event.target.files;
            if (!files.length || !activeNoteId || !currentUser) return;

            Array.from(files).forEach(file => {
                const storageRef = storage.ref(`users/${currentUser.uid}/${activeNoteId}/${Date.now()}_${file.name}`);
                storageRef.put(file).then(snapshot => snapshot.ref.getDownloadURL()).then(url => {
                    const note = notes.find(n => n.id === activeNoteId);
                    const updatedImages = [...(note.images || []), url];
                    db.collection('users').doc(currentUser.uid).collection('notes').doc(activeNoteId).update({
                        images: updatedImages
                    });
                    renderEditorMedia(updatedImages, note.links || []);
                });
            });
        }

        function promptAddLink() {
            const url = prompt("Paste your inspiration link (Instagram, Pinterest, YouTube, TikTok, Web):");
            if (url && activeNoteId && currentUser) {
                const note = notes.find(n => n.id === activeNoteId);
                const updatedLinks = [...(note.links || []), url];
                db.collection('users').doc(currentUser.uid).collection('notes').doc(activeNoteId).update({
                    links: updatedLinks
                });
                renderEditorMedia(note.images || [], updatedLinks);
            }
        }

        function removeImage(imgUrl) {
            if (!activeNoteId || !currentUser) return;
            const note = notes.find(n => n.id === activeNoteId);
            const updatedImages = note.images.filter(url => url !== imgUrl);
            db.collection('users').doc(currentUser.uid).collection('notes').doc(activeNoteId).update({
                images: updatedImages
            });
            renderEditorMedia(updatedImages, note.links || []);
        }

        function renderEditorMedia(images, links) {
            const gallery = document.getElementById('editor-gallery');
            const linksContainer = document.getElementById('editor-links');

            gallery.innerHTML = images.map(url => `
                <div class="polaroid-wrapper">
                    <button class="btn-remove-media" onclick="removeImage('${url}')">×</button>
                    <img src="${url}" alt="Inspiration Photo">
                </div>
            `).join('');

            linksContainer.innerHTML = links.map(url => `
                <a href="${url}" target="_blank" class="link-card">
                    <div class="link-info">
                        <span>🔗</span>
                        <span class="link-url">${url}</span>
                    </div>
                    <span>↗</span>
                </a>
            `).join('');
        }
    </script>
</body>
</html>
