<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congarden ✿ Personal Inspiration & Notes Garden</title>

    <!-- Visual Aesthetic Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bellota:ital,wght@0,400;0,700;1,400&family=Imprima&family=Instrument+Serif:ital@0;1&family=Josefin+Sans:wght@300;400;600&family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <style>
        /* ==================== AESTHETIC VISUAL SYSTEM ==================== */
        :root {
            --bg-paper: #FAF7F2;
            --bg-card: #FFFFFF;
            --bg-sidebar: rgba(243, 238, 231, 0.85);
            --accent-pink: #E8B4B8;
            --accent-pink-soft: #F9ECEE;
            --accent-sage: #A2B9A5;
            --accent-sage-soft: #EBF2EC;
            --accent-lavender: #C5B4E3;
            --accent-butter: #F7E7B4;
            --text-main: #4A3E3D;
            --text-muted: #8C7B79;
            --border-soft: #E6DDD5;
            --border-dashed: #D3C7BD;
            --shadow-subtle: 0 4px 20px rgba(74, 62, 61, 0.05);
            --shadow-card: 0 12px 32px rgba(74, 62, 61, 0.1);
            
            --font-title: 'Instrument Serif', serif;
            --font-ui: 'Josefin Sans', sans-serif;
            --font-body: 'Imprima', sans-serif;
            --font-cute: 'Bellota', cursive;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-body);
            color: var(--text-main);
        }

        body {
            background-color: var(--bg-paper);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Ambient Background Gradients */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
            animation: float 14s ease-in-out infinite alternate;
        }

        .blob-1 { top: -10%; left: -5%; width: 50vw; height: 50vw; background: var(--accent-pink-soft); }
        .blob-2 { bottom: -10%; right: -5%; width: 45vw; height: 45vw; background: var(--accent-sage-soft); animation-delay: -5s; }
        .blob-3 { top: 40%; left: 35%; width: 35vw; height: 35vw; background: #FFF6E5; animation-delay: -9s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(25px, -20px) scale(1.05); }
            100% { transform: translate(-15px, 15px) scale(0.95); }
        }

        /* Floating Petal Accents */
        .petal {
            position: fixed;
            pointer-events: none;
            user-select: none;
            opacity: 0.35;
            font-size: 1.2rem;
            animation: fall 12s linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.4; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* ==================== BEAUTIFIED WELCOME & AUTH OVERLAY ==================== */
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(250, 247, 242, 0.7);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.92);
            border: 2px dashed var(--accent-pink);
            border-radius: 28px;
            padding: 40px 36px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: var(--shadow-card);
            position: relative;
            z-index: 1;
        }

        .auth-card::before {
            content: "🌸 ✿ 🌿";
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-paper);
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 1.1rem;
            border: 1px dashed var(--accent-pink);
        }

        .auth-card h1 {
            font-family: var(--font-title);
            font-size: 3.2rem;
            font-weight: 400;
            margin-bottom: 4px;
        }

        .auth-subtitle {
            font-family: var(--font-cute);
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 24px;
        }

        /* Auth Tabs */
        .auth-tabs {
            display: flex;
            background: var(--bg-paper);
            border-radius: 50px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid var(--border-soft);
        }

        .tab-btn {
            flex: 1;
            padding: 8px 16px;
            border: none;
            background: transparent;
            font-family: var(--font-ui);
            font-weight: 600;
            font-size: 0.88rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .tab-btn.active {
            background: #FFF;
            color: var(--text-main);
            box-shadow: var(--shadow-subtle);
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-soft);
            background: var(--bg-paper);
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus { border-color: var(--accent-sage); background: #FFF; }

        .btn-action {
            background: var(--accent-sage);
            color: #FFF;
            border: none;
            padding: 12px;
            border-radius: 50px;
            font-family: var(--font-ui);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: var(--shadow-subtle);
        }

        .btn-action:hover { background: #91A894; transform: translateY(-1px); }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 20px;
            font-family: var(--font-ui);
        }

        .auth-divider::before, .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-soft);
        }

        .btn-google {
            background: #FFF;
            border: 1px solid var(--border-soft);
            padding: 11px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: var(--font-ui);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-subtle);
            width: 100%;
        }

        .btn-google:hover { background: var(--accent-pink-soft); border-color: var(--accent-pink); }

        /* ==================== MAIN APP LAYOUT ==================== */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .sidebar {
            width: 290px;
            background: var(--bg-sidebar);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            padding: 24px 18px;
            gap: 20px;
            flex-shrink: 0;
        }

        .brand {
            font-family: var(--font-title);
            font-size: 2.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 4px;
        }

        .search-box { position: relative; }
        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            border-radius: 50px;
            border: 1px solid var(--border-soft);
            background: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            outline: none;
        }
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            opacity: 0.5;
        }

        .nav-section-title {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin: 8px 8px 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-add-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .folder-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            flex: 1;
        }

        .folder-item {
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--font-ui);
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .folder-item:hover, .folder-item.active {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: var(--shadow-subtle);
        }

        .folder-item.active { font-weight: 600; }
        .folder-actions { display: none; gap: 6px; font-size: 0.8rem; }
        .folder-item:hover .folder-actions { display: flex; }

        .user-profile-bar {
            padding-top: 16px;
            border-top: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--accent-pink);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFF;
            font-weight: 600;
            font-family: var(--font-ui);
            object-fit: cover;
        }

        .user-name { font-size: 0.85rem; font-weight: 600; font-family: var(--font-ui); }
        .btn-logout { background: none; border: none; font-size: 0.8rem; color: var(--text-muted); cursor: pointer; }

        /* Content Area */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 24px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-soft);
            background: rgba(250, 247, 242, 0.6);
            backdrop-filter: blur(8px);
        }

        .header-title { font-family: var(--font-title); font-size: 2.2rem; }

        .btn-new-note {
            background: var(--accent-sage);
            color: #FFF;
            border: none;
            padding: 10px 22px;
            border-radius: 50px;
            font-family: var(--font-ui);
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-subtle);
            transition: transform 0.2s;
        }

        .btn-new-note:hover { transform: translateY(-1px); }

        .notes-view { flex: 1; padding: 36px; overflow-y: auto; }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
        }

        .note-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-subtle);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .note-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-card);
            border-color: var(--accent-pink);
        }

        .note-card-title { font-family: var(--font-ui); font-weight: 600; font-size: 1.1rem; }
        .note-card-snippet { font-size: 0.9rem; color: var(--text-muted); line-height: 1.4; max-height: 60px; overflow: hidden; }
        .note-card-media-preview { width: 100%; height: 140px; border-radius: 10px; object-fit: cover; }
        .note-card-footer { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: auto; }

        /* Scrapbook Editor */
        .editor-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-paper);
            z-index: 500;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }
        .editor-overlay.active { display: flex; }

        .editor-header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-soft);
            background: rgba(250, 247, 242, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .btn-back { background: none; border: none; font-family: var(--font-ui); font-size: 1rem; cursor: pointer; }
        .editor-body { max-width: 760px; width: 100%; margin: 0 auto; padding: 40px 20px 100px 20px; display: flex; flex-direction: column; gap: 24px; }
        .editor-title { font-family: var(--font-title); font-size: 2.8rem; border: none; outline: none; background: transparent; width: 100%; }
        .editor-text { font-size: 1.05rem; line-height: 1.7; border: none; outline: none; background: transparent; resize: none; min-height: 150px; width: 100%; }

        .editor-toolbar { display: flex; gap: 12px; padding: 12px 0; border-top: 1px dashed var(--border-dashed); border-bottom: 1px dashed var(--border-dashed); }
        .btn-tool { background: #FFF; border: 1px solid var(--border-soft); padding: 8px 16px; border-radius: 50px; font-family: var(--font-ui); font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }

        .scrapbook-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        .polaroid-wrapper { background: #FFF; padding: 10px 10px 20px 10px; border-radius: 8px; box-shadow: var(--shadow-subtle); border: 1px solid var(--border-soft); position: relative; }
        .polaroid-wrapper img { width: 100%; height: 160px; object-fit: cover; border-radius: 4px; }
        .btn-remove-media { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.5); color: #FFF; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; }

        .link-cards-container { display: flex; flex-direction: column; gap: 10px; }
        .link-card { background: #FFF; border: 1px solid var(--border-soft); padding: 12px 16px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; }
        .link-url { font-size: 0.85rem; color: var(--accent-sage); word-break: break-all; }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; padding: 16px; }
            .notes-view { padding: 16px; }
        }
    </style>
</head>
<body>

    <!-- Ambient Visual Background Gradients -->
    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Floating Organic Accents -->
    <div class="petal" style="left: 10%; animation-delay: 0s;">✿</div>
    <div class="petal" style="left: 30%; animation-delay: 3s;">🌸</div>
    <div class="petal" style="left: 65%; animation-delay: 6s;">🌿</div>
    <div class="petal" style="left: 85%; animation-delay: 2s;">✿</div>

    <!-- BEAUTIFIED AUTHENTICATION OVERLAY -->
    <div id="auth-overlay" class="auth-overlay">
        <div class="auth-card">
            <h1>congarden</h1>
            <p class="auth-subtitle">your personal digital inspiration garden</p>

            <!-- Auth Mode Switcher -->
            <div class="auth-tabs">
                <button class="tab-btn active" id="tab-signin" onclick="switchAuthTab('signin')">Sign In</button>
                <button class="tab-btn" id="tab-signup" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>

            <!-- Email/Password Form -->
            <form class="auth-form" id="auth-form" onsubmit="handleEmailAuth(event)">
                <input type="email" id="auth-email" class="input-field" placeholder="Email address" required>
                <input type="password" id="auth-password" class="input-field" placeholder="Password (min 6 chars)" required>
                <button type="submit" id="auth-submit-btn" class="btn-action">Sign In</button>
            </form>

            <div class="auth-divider">or continuous with</div>


    <!-- MAIN GARDEN APPLICATION -->
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                congarden <span style="font-size:1.2rem; color:var(--accent-pink);">✿</span>
            </div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search garden..." oninput="filterNotes()">
            </div>

            <div class="nav-section-title">
                <span>My Folders</span>
                <button class="btn-add-icon" onclick="promptCreateFolder()" title="Create Folder">＋</button>
            </div>

            <ul class="folder-list" id="folder-list"></ul>

            <div class="user-profile-bar">
                <div class="user-info">
                    <div id="user-avatar" class="user-avatar">?</div>
                    <span id="user-name" class="user-name">Gardener</span>
                </div>
                <button class="btn-logout" onclick="logout()">Sign Out</button>
            </div>
        </aside>

        <main class="content-area">
            <header class="content-header">
                <h2 id="current-folder-title" class="header-title">🌸 All Inspiration</h2>
                <button class="btn-new-note" onclick="openEditor()">＋ New Note</button>
            </header>

            <div class="notes-view">
                <div class="notes-grid" id="notes-grid"></div>
            </div>
        </main>
    </div>

    <!-- EDITOR OVERLAY -->
    <div id="editor-overlay" class="editor-overlay">
        <div class="editor-header">
            <button class="btn-back" onclick="closeEditor()">← Back to Garden</button>
            <div style="display: flex; gap: 10px;">
                <button class="btn-tool" onclick="toggleFavorite()"><span id="fav-icon">♡</span> Favorite</button>
                <button class="btn-tool" style="color: #d9534f;" onclick="deleteCurrentNote()">Delete</button>
            </div>
        </div>

        <div class="editor-body">
            <input type="text" id="editor-title" class="editor-title" placeholder="Note Title..." oninput="autoSaveNote()">
            
            <div class="editor-toolbar">
                <label class="btn-tool">
                    📷 + Photo
                    <input type="file" id="photo-input" accept="image/*" multiple style="display: none;" onchange="handlePhotoUpload(event)">
                </label>
                <button class="btn-tool" onclick="promptAddLink()">🔗 + Link</button>
            </div>

            <textarea id="editor-text" class="editor-text" placeholder="Write thoughts, ideas, references freely..." oninput="autoSaveNote()"></textarea>

            <div class="scrapbook-gallery" id="editor-gallery"></div>
            <div class="link-cards-container" id="editor-links"></div>
        </div>
    </div>

    <!-- LOGIC & AUTH IMPLEMENTATION -->
    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        let currentUser = null;
        let authMode = 'signin';
        let folders = [];
        let notes = [];
        let activeFolderId = 'all';
        let activeNoteId = null;
        let saveTimeout = null;

        /* Auth Mode Switcher */
        function switchAuthTab(mode) {
            authMode = mode;
            document.getElementById('tab-signin').classList.toggle('active', mode === 'signin');
            document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
            document.getElementById('auth-submit-btn').innerText = mode === 'signin' ? 'Sign In' : 'Create Account';
        }

        /* Email Authentication */
        function handleEmailAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if (authMode === 'signup') {
                auth.createUserWithEmailAndPassword(email, password)
                    .catch(err => alert("Sign up error: " + err.message));
            } else {
                auth.signInWithEmailAndPassword(email, password)
                    .catch(err => alert("Sign in error: " + err.message));
            }
        }

        function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert("Google Sign-In failed: " + err.message));
        }

        function logout() { auth.signOut(); }

        /* Auth Listener */
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-overlay').style.display = 'none';
                
                const avatarEl = document.getElementById('user-avatar');
                if (user.photoURL) {
                    avatarEl.innerHTML = `<img src="${user.photoURL}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                } else {
                    avatarEl.innerText = (user.email || 'U').charAt(0).toUpperCase();
                }
                document.getElementById('user-name').innerText = user.displayName || user.email.split('@')[0];
                loadUserData();
            } else {
                currentUser = null;
                document.getElementById('auth-overlay').style.display = 'flex';
            }
        });

        /* Data Sync */
        function loadUserData() {
            if (!currentUser) return;
            db.collection('users').doc(currentUser.uid).collection('folders').onSnapshot(snapshot => {
                folders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderFolders();
            });

            db.collection('users').doc(currentUser.uid).collection('notes').orderBy('updatedAt', 'desc').onSnapshot(snapshot => {
                notes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderNotes();
            });
        }

        /* Folder Management */
        function renderFolders() {
            const list = document.getElementById('folder-list');
            list.innerHTML = `
                <li class="folder-item ${activeFolderId === 'all' ? 'active' : ''}" onclick="selectFolder('all')">
                    <span>🌷 All Inspiration</span>
                </li>
                <li class="folder-item ${activeFolderId === 'favorites' ? 'active' : ''}" onclick="selectFolder('favorites')">
                    <span>♡ Favorites</span>
                </li>
            `;

            folders.forEach(folder => {
                const li = document.createElement('li');
                li.className = `folder-item ${activeFolderId === folder.id ? 'active' : ''}`;
                li.onclick = () => selectFolder(folder.id);
                li.innerHTML = `
                    <span>📁 ${folder.name}</span>
                    <div class="folder-actions">
                        <span onclick="event.stopPropagation(); deleteFolder('${folder.id}')">🗑️</span>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function selectFolder(id) {
            activeFolderId = id;
            renderFolders();
            const titleElement = document.getElementById('current-folder-title');
            if (id === 'all') titleElement.innerText = '🌸 All Inspiration';
            else if (id === 'favorites') titleElement.innerText = '♡ Favorites';
            else {
                const folder = folders.find(f => f.id === id);
                titleElement.innerText = folder ? `📁 ${folder.name}` : 'Folder';
            }
            renderNotes();
        }

        function promptCreateFolder() {
            const name = prompt("Enter new folder name:");
            if (name && currentUser) {
                db.collection('users').doc(currentUser.uid).collection('folders').add({
                    name: name,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
        }

        function deleteFolder(id) {
            if (confirm("Delete this folder? Notes inside will remain safely stored.")) {
                db.collection('users').doc(currentUser.uid).collection('folders').doc(id).delete();
                if (activeFolderId === id) selectFolder('all');
            }
        }

        /* Note Grid & Search */
        function renderNotes() {
            const grid = document.getElementById('notes-grid');
            grid.innerHTML = '';

            let filtered = notes;
            if (activeFolderId === 'favorites') filtered = notes.filter(n => n.favorite);
            else if (activeFolderId !== 'all') filtered = notes.filter(n => n.folderId === activeFolderId);

            const query = document.getElementById('search-input').value.toLowerCase();
            if (query) {
                filtered = filtered.filter(n => 
                    (n.title && n.title.toLowerCase().includes(query)) ||
                    (n.text && n.text.toLowerCase().includes(query))
                );
            }

            filtered.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.onclick = () => openEditor(note.id);

                let mediaHTML = note.images && note.images.length > 0 
                    ? `<img src="${note.images[0]}" class="note-card-media-preview" alt="Inspiration preview">` 
                    : '';

                card.innerHTML = `
                    ${mediaHTML}
                    <div class="note-card-title">${note.title || 'Untitled Note'}</div>
                    <div class="note-card-snippet">${note.text || 'Write anything...'}</div>
                    <div class="note-card-footer">
                        <span>${note.images ? note.images.length : 0} 📷 • ${note.links ? note.links.length : 0} 🔗</span>
                        <span>${note.favorite ? '♡' : ''}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterNotes() { renderNotes(); }

        /* Editor Functions */
        function openEditor(noteId = null) {
            activeNoteId = noteId;
            document.getElementById('editor-overlay').classList.add('active');

            if (noteId) {
                const note = notes.find(n => n.id === noteId);
                document.getElementById('editor-title').value = note.title || '';
                document.getElementById('editor-text').value = note.text || '';
                document.getElementById('fav-icon').innerText = note.favorite ? '♥' : '♡';
                renderEditorMedia(note.images || [], note.links || []);
            } else {
                document.getElementById('editor-title').value = '';
                document.getElementById('editor-text').value = '';
                document.getElementById('fav-icon').innerText = '♡';
                renderEditorMedia([], []);
                saveNewNote();
            }
        }

        function closeEditor() {
            document.getElementById('editor-overlay').classList.remove('active');
            activeNoteId = null;
        }

        function saveNewNote() {
            if (!currentUser) return;
            const newDocRef = db.collection('users').doc(currentUser.uid).collection('notes').doc();
            activeNoteId = newDocRef.id;
            newDocRef.set({
                title: '',
                text: '',
                folderId: activeFolderId === 'favorites' ? 'all' : activeFolderId,
                images: [],
                links: [],
                favorite: false,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function autoSaveNote() {
            if (!activeNoteId || !currentUser) return;
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                db.collection('users').doc(currentUser.uid).collection('notes').doc(activeNoteId).update({
                    title: document.getElementById('editor-title').value,
                    text: document.getElementById('editor-text').value,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }, 400);
        }

        function toggleFavorite() {
            if (!activeNoteId || !currentUser) return;
            const note = notes.find(n => n.id === activeNoteId);
            const newState = !note.favorite;
            document.getElementById('fav-icon').innerText = newState ? '♥' : '♡';
            db.collection('users').doc(currentUser.uid).collection('notes').doc(activeNoteId).update({ favorite: newState });
        }

        function deleteCurrentNote() {
            if (activeNoteId && currentUser && confirm("Delete this note?")) {
                db.collection('users').doc(currentUser.uid).collection('notes').doc(activeNoteId).delete();
                closeEditor();
            }
        }

        function handlePhotoUpload(event) {
            const files = event.target.files;
            if (!files.length || !activeNoteId || !currentUser) return;

            Array.from(files).forEach(file => {
                const storageRef = storage.ref(`users/${currentUser.uid}/${activeNoteId}/${Date.now()}_${file.name}`);
                storageRef.put(file).then(snapshot => snapshot.ref.getDownloadURL()).then(url => {
                    const note = notes.find(n => n.id === activeNoteId);
                    const updatedImages = [...(note.images || []), url];
                    db.collection('users').doc(currentUser.uid).collection('notes').doc(activeNoteId).update({ images: updatedImages });
                    renderEditorMedia(updatedImages, note.links || []);
                });
            });
        }

        function promptAddLink() {
            const url = prompt("Paste your link (Instagram, Pinterest, YouTube, web):");
            if (url && activeNoteId && currentUser) {
                const note = notes.find(n => n.id === activeNoteId);
                const updatedLinks = [...(note.links || []), url];
                db.collection('users').doc(currentUser.uid).collection('notes').doc(activeNoteId).update({ links: updatedLinks });
                renderEditorMedia(note.images || [], updatedLinks);
            }
        }

        function removeImage(imgUrl) {
            if (!activeNoteId || !currentUser) return;
            const note = notes.find(n => n.id === activeNoteId);
            const updatedImages = note.images.filter(url => url !== imgUrl);
            db.collection('users').doc(currentUser.uid).collection('notes').doc(activeNoteId).update({ images: updatedImages });
            renderEditorMedia(updatedImages, note.links || []);
        }

        function renderEditorMedia(images, links) {
            document.getElementById('editor-gallery').innerHTML = images.map(url => `
                <div class="polaroid-wrapper">
                    <button class="btn-remove-media" onclick="removeImage('${url}')">×</button>
                    <img src="${url}" alt="Photo">
                </div>
            `).join('');

            document.getElementById('editor-links').innerHTML = links.map(url => `
                <a href="${url}" target="_blank" class="link-card">
                    <span>🔗 <span class="link-url">${url}</span></span>
                    <span>↗</span>
                </a>
            `).join('');
        }
    </script>
</body>
</html>
